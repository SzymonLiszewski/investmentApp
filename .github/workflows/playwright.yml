# End-to-end browser tests (Chromium, Firefox, WebKit) on push and PRs to main.
# Playwright starts the Django API (backend.settings_e2e, seeded demo user) and the Vite dev server
# itself in CI, see webServer in playwright.config.ts. The HTML report is uploaded as an artifact.

name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-docker.txt

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install e2e test dependencies
      run: npm ci
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
