# Development override. Uses USE_MOCK_DATA_FETCHER=true for stock/crypto/FX.
# For prices, news and economic calendar, set ALPHAVANTAGE_API_KEY and NEWSDATA_API_KEY in .env if needed (see .env.example).
# Usage (from repo root): docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml --project-directory . up -d
# Paths are relative to project directory (repo root); --project-directory . is required on Windows.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    user: "root"  # so volume mount has no permission issues
    environment:
      SECRET_KEY: "dev-secret-key-not-for-production"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      ENABLE_ML_FUNCTIONS: "false"
      DEBUG: "true"
      USE_MOCK_DATA_FETCHER: "false"
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
      USE_ECONOMIC_CALENDAR_API: ${USE_ECONOMIC_CALENDAR_API:-true}
      USE_YAHOO_NEWS_API: ${USE_YAHOO_NEWS_API:-true}
      USE_NEWSDATA_NEWS_API: ${USE_NEWSDATA_NEWS_API:-true}
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_MODELS_DIR: /models
    volumes:
      - ../backend:/app
      - ml_models:/models
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_polish_stocks && python manage.py seed_crypto && python manage.py seed_economic_data && python manage.py seed_polish_bonds && python manage.py seed_nasdaq_stocks && python manage.py seed_economic_calendar && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    user: "root"  # so volume mount has no permission issues
    environment:
      SECRET_KEY: "dev-secret-key-not-for-production"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      ENABLE_ML_FUNCTIONS: "false"
      DEBUG: "true"
      USE_MOCK_DATA_FETCHER: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_MODELS_DIR: /models
    volumes:
      - ../backend:/app
      - ml_models:/models
    # NOTE: the worker does not auto-reload; restart it to pick up code changes.
    command: celery -A backend worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    user: "root"
    environment:
      SECRET_KEY: "dev-secret-key-not-for-production"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      ENABLE_ML_FUNCTIONS: "false"
      DEBUG: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_MODELS_DIR: /models
    volumes:
      - ../backend:/app
    # schedule file in /tmp so it never lands in the bind-mounted source tree
    command: celery -A backend beat -l info --schedule=/tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
      # Browser on the host calls Django via published port (bypasses Vite proxy for API).
      VITE_API_BASE_URL: "http://127.0.0.1:8000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stocksense.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
  pgadmin_data_dev:
  ml_models:
